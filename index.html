<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2AC1BC">
<title>아빠랑 과학 한 판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--mint:#2AC1BC;--ink:#212121;--white:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--mint);color:var(--ink);transition:background .2s}
body.a{background:var(--white)}
.app{max-width:440px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--mint);transition:background .2s;overflow:hidden}
body.a .app{background:var(--white)}
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(22px + env(safe-area-inset-top)) 22px 0}
.pill{display:inline-block;font-size:13px;font-weight:500;padding:5px 13px;border-radius:99px;background:var(--white);color:var(--ink)}
body.a .pill{background:var(--mint);color:var(--white)}
.count{font-size:13px;color:var(--white)}
body.a .count{color:var(--ink)}
.main{flex:1;padding:26px 22px 12px;overflow-y:auto}
.big{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400}
.q{font-size:clamp(26px,8vw,34px);line-height:1.4;color:var(--white);margin:0 0 18px;word-break:keep-all}
.art{background:var(--white);border-radius:20px;padding:10px;margin:0 0 18px}
.art img{display:block;width:100%;height:auto;border-radius:12px}
.opts{display:flex;flex-direction:column;gap:9px;margin:0 0 12px}
.opt{font:inherit;font-size:15px;line-height:1.45;text-align:left;word-break:keep-all;background:var(--white);color:var(--ink);border:2px solid var(--white);border-radius:99px;padding:9px 16px 9px 10px;cursor:pointer;display:flex;align-items:center;gap:10px}
.opt .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--mint);color:var(--white);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center}
.opt .m{margin-left:auto;font-weight:500}
.opt:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.opts.done .opt{cursor:default;opacity:.55}
.opts.done .opt.ok{opacity:1;background:#FFD43B;border-color:#FFD43B;color:var(--ink);font-weight:500}
.opts.done .opt.ok .n{background:var(--ink);color:#FFD43B}
.opts.done .opt.no{opacity:1;background:#E5484D;border-color:#E5484D;color:var(--white);animation:shake .35s}
.opts.done .opt.no .n{background:var(--white);color:#E5484D}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pop{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9}
.fb{font-size:15px;line-height:1.6;color:var(--white);margin:0}
.label{font-size:13px;margin:0 0 6px}
.word{line-height:1.1;margin:0 0 18px 28px;color:var(--mint);white-space:nowrap;text-shadow:-9px 0 0 rgba(42,193,188,.55),-18px 0 0 rgba(42,193,188,.28),-27px 0 0 rgba(42,193,188,.12)}
@keyframes trail{from{text-shadow:0 0 0 rgba(42,193,188,0),0 0 0 rgba(42,193,188,0),0 0 0 rgba(42,193,188,0)}}
.word{animation:trail .6s ease-out}
.explain{font-size:15px;line-height:1.8;margin:0 0 18px;word-break:keep-all}
.exp{border:1.5px solid var(--mint);border-radius:16px;padding:13px 15px}
.exp .pill{background:var(--mint);color:var(--white)}
.exp p{font-size:15px;line-height:1.6;margin:8px 0 0}
.bar{padding:12px 22px calc(18px + env(safe-area-inset-bottom));display:flex;gap:10px}
.btn{font:inherit;font-size:16px;font-weight:500;border:0;border-radius:14px;padding:14px;cursor:pointer;flex:1}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.next{background:var(--white);color:var(--ink)}
body.a .next{background:var(--mint);color:var(--white)}
.prev{flex:0 0 52px;background:var(--white);color:var(--mint);border:1.5px solid var(--mint);padding:12.5px 0;font-size:20px}
.ver{text-align:center;font-size:11px;color:var(--white);padding:0 0 10px}
body.a .ver{color:var(--ink)}
.hide{display:none}
.score{font-size:clamp(64px,22vw,96px);line-height:1.05;color:var(--white);margin:6px 0 4px}
.score small{font-size:.4em;margin-left:6px}
.rmsg{font-size:20px;line-height:1.5;color:var(--white);margin:0 0 16px;word-break:keep-all}
.rcount{font-size:15px;color:var(--white);margin:0 0 18px}
.again{margin:0 0 8px;font-size:15px;color:var(--white)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .pill{background:transparent;color:var(--white);border:1.5px solid var(--white)}
.stage{display:flex;justify-content:center;gap:6px;margin:6px 0 10px}
.dc{width:22%;max-width:84px;overflow:visible}
.dc .bob{animation:bob .6s ease-in-out infinite alternate;transform-origin:40px 110px}
.dc .al{transform-origin:25px 52px;animation:armL .6s ease-in-out infinite alternate}
.dc .ar{transform-origin:55px 52px;animation:armR .6s ease-in-out infinite alternate}
.dc .ll{transform-origin:33px 84px;animation:legL .6s ease-in-out infinite alternate}
.dc .lr{transform-origin:47px 84px;animation:legR .6s ease-in-out infinite alternate}
.dc .hd{transform-origin:40px 40px;animation:tilt 1.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-10px) rotate(4deg)}}
@keyframes armL{from{transform:rotate(-140deg)}to{transform:rotate(-20deg)}}
@keyframes armR{from{transform:rotate(20deg)}to{transform:rotate(140deg)}}
@keyframes legL{from{transform:rotate(14deg)}to{transform:rotate(-8deg)}}
@keyframes legR{from{transform:rotate(8deg)}to{transform:rotate(-14deg)}}
@keyframes tilt{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@media (prefers-reduced-motion:reduce){.dc *{animation:none!important}.word{animation:none}.opts.done .opt.no{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><span class="pill" id="topic"></span><span class="count" id="count"></span></div>
  <div class="main" id="main"></div>
  <div class="bar">
    <button class="btn prev hide" id="prev" aria-label="이전 카드">&#8249;</button>
    <button class="btn next" id="next"></button>
  </div>
  <div class="ver" id="ver"></div>
</div>
<script>
var VERSION = 'v1.5';
var ART_COUNT = 13;
var CARDS = [
 {t:'힘과 운동', q:'달리던 버스가 갑자기 멈추면, 몸은 왜 앞으로 쏠릴까?', g:'버스는 멈췄는데 내 몸은 왜 안 멈출까? 한 줄씩 말해봐.', w:'관성', e:'움직이던 건 계속 움직이려 하고, 멈춰 있던 건 계속 멈춰 있으려 해. 버스가 멈춰도 내 몸은 아직 달리던 중이야.', x:'종이 밑에 동전을 놓고 종이를 휙 빼봐.'},
 {t:'힘과 운동', q:'무거운 공과 가벼운 공을 같은 높이에서 떨어뜨리면 어느 쪽이 먼저 닿을까?', g:'무거운 게 더 센 힘으로 끌려가니까 먼저일까? 먼저 골라봐.', w:'중력가속도', e:'공기 저항이 거의 없으면 무게와 상관없이 같이 떨어져. 지구가 모든 물체를 똑같은 가속도로 당기기 때문이야.', x:'책 위에 종이 한 장을 올려서 같이 떨어뜨려 봐.'},
 {t:'힘과 운동', q:'바퀴 달린 의자에 앉아 벽을 밀면, 벽은 가만히 있는데 왜 내가 뒤로 밀릴까?', g:'벽은 안 움직였는데 나만 움직인 이유가 뭘까?', w:'작용 반작용', e:'내가 벽을 미는 힘이 있으면, 벽도 똑같은 크기로 나를 반대 방향으로 밀어. 힘은 항상 둘이 한 쌍으로 나타나.', x:'바퀴 달린 의자에 앉아 벽을 밀어 봐. 반대로 벽 대신 아빠를 밀면 누가 움직일까?'},
 {t:'힘과 운동', q:'공을 받을 때 손을 뒤로 빼면서 받으면 왜 덜 아플까?', g:'공의 속도는 같은데 왜 느낌이 다를까?', w:'충격량', e:'공을 멈추게 하는 전체 효과(충격량)는 같아. 그런데 멈추는 시간이 길어지면 손이 받는 힘은 작아져.', x:'작은 공을 손을 딱 고정해서 받을 때와 뒤로 빼면서 받을 때를 비교해 봐.'},

 {t:'물질의 성질', q:'얼음은 왜 물 위에 둥둥 뜰까?', g:'보통 고체가 액체보다 더 단단하게 뭉쳐 있잖아. 그럼 가라앉아야 하지 않을까?', w:'밀도', e:'물은 얼면 부피가 커져서 같은 양이라도 더 가벼워져. 밀도가 작은 얼음이 밀도가 큰 물 위에 뜨는 거야.', x:'컵에 얼음을 띄우고 물에 잠긴 부분과 위로 나온 부분을 비교해 봐.'},
 {t:'물질의 변화', q:'깎아 둔 사과는 왜 갈색으로 변할까?', g:'사과 속에서 무슨 일이 벌어진 걸까?', w:'산화', e:'사과 속 성분이 공기 중 산소와 만나 다른 물질로 변하는 거야. 이런 반응을 산화라고 해.', x:'사과 조각 두 개 중 하나에만 레몬즙을 발라 두고 10분 뒤에 비교해 봐.'},

 {t:'생명 시스템', q:'열심히 뛰고 나면 왜 숨이 차고 심장이 빨리 뛸까?', g:'몸은 지금 뭘 더 많이 필요로 하는 걸까?', w:'세포호흡', e:'우리 몸의 세포는 산소로 포도당을 분해해서 에너지를 얻어. 운동하면 에너지가 더 필요해서 산소를 더 많이 실어 나르려고 숨과 심장이 빨라져.', x:'가만히 있을 때와 제자리 뛰기 1분 뒤에 맥박을 재서 비교해 봐.'},

 {t:'지구 시스템', q:'구름 낀 밤은 맑은 밤보다 왜 덜 추울까?', g:'구름은 하늘에 떠 있기만 한데 어떻게 온도에 영향을 줄까?', w:'온실 효과', e:'땅이 내보내는 열을 구름과 대기 속 기체가 붙잡았다가 다시 땅으로 돌려보내. 이게 지구가 따뜻한 이유와 같은 원리야.', x:'맑은 날과 흐린 날의 아침 기온을 날씨 앱에서 비교해 봐.'},

];
var OPTS = [

 [['무거운 공이 먼저','가벼운 공이 먼저','거의 동시에','매번 달라서 알 수 없다'],2],
 [['벽이 가만히 있어서','의자 바퀴가 미끄러워서','벽도 나를 똑같이 밀어서','내가 벽보다 가벼워서'],2],
 [['공이 더 가벼워져서','멈추는 시간이 길어져서','공의 속도가 느려져서','손이 더 단단해져서'],1],
 [['입김이 불이 붙어서','입김 속 먼지가 하얘서','입김이 얼음 덩어리라서','수증기가 작은 물방울로 변해서'],3],
 [['얼음이 물보다 차가워서','얼음 속에 공기가 가득해서','얼음이 물보다 밀도가 작아서','물이 얼음을 밀어 올려서'],2],
 [['사과가 햇빛에 타서','사과 속 물이 말라서','사과가 공기 중 산소와 만나서','사과가 차가워져서'],2],
 [['소금이 열을 내서','소금이 얼음을 뜨겁게 데워서','소금물은 0℃보다 낮아야 얼어서','소금이 얼음을 빨아들여서'],2],
 [['물감을 섞어서','금속마다 내는 불꽃 색이 달라서','불을 세게 붙여서','연기가 색을 입혀서'],1],
 [['밥이 설탕으로 변해서','침 속 효소가 녹말을 당으로 바꿔서','씹는 힘이 열을 내서','침이 단맛이라서'],1],
 [['소금이 물을 마셔서','배추가 열을 받아서','배추 속 물이 농도 높은 쪽(소금)으로 빠져나가서','배추가 소금을 녹여서'],2],
 [['몸이 지쳐서 소리가 나서','근육이 더 많은 산소와 영양분을 써서','폐가 작아져서','피가 차가워져서'],1],
 [['흙에서 밥을 얻어서','햇빛·물·이산화탄소로 직접 양분을 만들어서','밤에 몰래 먹어서','공기 중 영양분을 그대로 마셔서'],1],
 [['모래가 바닷물보다 햇빛을 더 받아서','바닷물이 빛을 반사해서','바닷물이 증발하며 다 식어서','물은 같은 열에도 온도가 덜 올라서(비열이 커서)'],3],
 [['구름이 땅의 열을 가둬 덜 식게 해서','구름이 달빛을 모아서','구름이 따뜻한 비를 내려서','구름 속에 불씨가 있어서'],0],
 [['땅이 판처럼 여러 조각으로 움직이고 그 경계가 모여서','땅 속에 큰 동굴이 있는 곳에서만','사람이 많이 사는 곳에서만','달의 힘이 센 곳에서만'],0],
 [['처음에 가장 힘이 세서','처음 높이에서 얻은 에너지로 다음 언덕을 넘어서','높을수록 바람이 약해서','레일이 길어서'],1],
 [['손이 열을 만드는 피를 모아서','추위가 손을 데워서','마찰로 움직임 에너지가 열로 바뀌어서','공기가 손을 눌러서'],2],
 [['문고리에 불이 나서','문고리가 얼어서','문고리가 자석이라서','몸에 쌓인 전기가 한꺼번에 흘러서'],3],
 [['지구 그림자가 달을 가려서','달이 스스로 모양을 바꿔서','구름이 달을 가려서','우리가 보는 달의 햇빛 받는 면이 달라져서'],3]
];
var KEY='sciWithDadPos';
var idx=0, phase='q', picked=null, results=[];
for(var z=0;z<20;z++)results.push(null);
try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.i>=0&&s.i<CARDS.length){idx=s.i;phase=(s.p==='a'||s.p==='r')?s.p:'q';if(s.r&&s.r.length===20)results=s.r;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({i:idx,p:phase,r:results}));}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function render(){
  var c=CARDS[idx];
  document.body.className=phase;
  picked=null;
  document.getElementById('topic').textContent=phase==='r'?'결과':c.t;
  document.getElementById('count').textContent=phase==='r'?'':(idx+1)+' / '+CARDS.length;
  document.getElementById('ver').textContent=VERSION;
  var m=document.getElementById('main');
  if(phase==='r'){renderResult(m);}
  else if(phase==='q'){
    var art=idx<ART_COUNT?'<div class="art"><img src="art/card'+('0'+(idx+1)).slice(-2)+'.webp" alt="" width="800"></div>':'';
    var o=OPTS[idx][0],h='';
    for(var k=0;k<o.length;k++)h+='<button class="opt" data-k="'+k+'"><span class="n">'+(k+1)+'</span><span class="t">'+esc(o[k])+'</span></button>';
    m.innerHTML='<p class="q big">'+esc(c.q)+'</p>'+art+'<div class="opts" id="opts">'+h+'</div><p class="fb" id="fb"></p>';
    document.getElementById('next').textContent='답 보기';
  }else{
    m.innerHTML='<p class="label">오늘 잡을 개념</p><p class="word big" id="word">'+esc(c.w)+'</p><p class="explain">'+esc(c.e)+'</p><div class="exp"><span class="pill">미니 실험</span><p>'+esc(c.x)+'</p></div>';
    var w=document.getElementById('word');
    var avail=Math.min(m.clientWidth,440)-44-28-30;
    var len=c.w.length;
    w.style.fontSize=Math.max(28,Math.min(72,Math.floor(avail/(len*1.02))))+'px';
    document.getElementById('next').textContent=idx===CARDS.length-1?'결과 보기':'다음 카드';
  }
  document.getElementById('prev').classList.toggle('hide',phase==='r'?false:(phase==='q'||idx===0));
  m.scrollTop=0;
  save();
}
function dancer(shirt,hair,skin,delay){
  var d='animation-delay:'+delay+'s';
  return '<svg class="dc" viewBox="0 0 80 120" aria-hidden="true"><g class="bob" style="'+d+'">'
   +'<g class="ll" style="'+d+'"><rect x="28" y="82" width="10" height="28" rx="5" fill="#212121"/></g>'
   +'<g class="lr" style="'+d+'"><rect x="42" y="82" width="10" height="28" rx="5" fill="#212121"/></g>'
   +'<g class="al" style="'+d+'"><rect x="19" y="50" width="10" height="26" rx="5" fill="'+skin+'"/></g>'
   +'<g class="ar" style="'+d+'"><rect x="51" y="50" width="10" height="26" rx="5" fill="'+skin+'"/></g>'
   +'<rect x="22" y="48" width="36" height="42" rx="12" fill="'+shirt+'"/>'
   +'<g class="hd" style="'+d+'"><circle cx="40" cy="30" r="17" fill="'+skin+'"/>'
   +'<path d="M23 29a17 17 0 0 1 34 0c-6-8-13-9-17-9s-11 1-17 9z" fill="'+hair+'"/>'
   +'<circle cx="34" cy="33" r="2" fill="#212121"/><circle cx="46" cy="33" r="2" fill="#212121"/>'
   +'<path d="M34 39q6 6 12 0" stroke="#212121" stroke-width="2" fill="none" stroke-linecap="round"/>'
   +'<circle cx="30" cy="38" r="3" fill="#FF9DB0" opacity=".7"/><circle cx="50" cy="38" r="3" fill="#FF9DB0" opacity=".7"/></g>'
   +'</g></svg>';
}
function renderResult(m){
  var ok=0,i,wrong=[];
  for(i=0;i<results.length;i++){if(results[i]===true)ok++;else wrong.push(CARDS[i].w);}
  var pts=ok*5,msg;
  if(pts===100)msg='만점이다! 오늘 완전 정복했어';
  else if(pts>=80)msg='거의 다 왔어! 몇 개만 다시 보자';
  else if(pts>=60)msg='좋아, 절반은 넘었어! 틀린 개념만 다시 한 판';
  else msg='괜찮아, 이제부터 잡으면 돼. 다시 한 판 가자';
  var h='';
  if(pts===100){
    h+='<div class="stage">'+dancer('#FFFFFF','#212121','#FFC9C0',0)+dancer('#FFD43B','#7B3F00','#F2B8A0',.15)+dancer('#FF6B8B','#212121','#FFC9C0',.3)+dancer('#212121','#FFD43B','#F2B8A0',.45)+'</div>';
  }
  h+='<p class="score big">'+pts+'<small>점</small></p><p class="rcount">'+CARDS.length+'문제 중 '+ok+'개 맞혔어</p><p class="rmsg">'+esc(msg)+'</p>';
  if(wrong.length){
    h+='<p class="again">다시 볼 개념</p><div class="chips">';
    for(i=0;i<wrong.length;i++)h+='<span class="pill">'+esc(wrong[i])+'</span>';
    h+='</div>';
  }
  m.innerHTML=h;
  document.getElementById('next').textContent='처음부터 다시';
  if(pts===100)setTimeout(function(){if(phase==='r')fireworks();},250);
}
function pick(k){
  if(picked!==null)return;
  picked=k;
  if(results[idx]===null)results[idx]=(k===OPTS[idx][1]);
  save();
  var ans=OPTS[idx][1],box=document.getElementById('opts'),bs=box.children;
  box.className='opts done';
  for(var i=0;i<bs.length;i++){
    if(i===ans){bs[i].classList.add('ok');bs[i].insertAdjacentHTML('beforeend','<span class="m">\u2713</span>');}
    else if(i===k){bs[i].classList.add('no');}
  }
  document.getElementById('fb').textContent=(k===ans)?'맞아! 바로 그거야.':'아깝다! \u2713 표시한 게 정답이야.';
  if(k===ans)fireworks();
}
function fireworks(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var cv=document.createElement('canvas'),W=cv.width=innerWidth,H=cv.height=innerHeight,g=cv.getContext('2d');
  cv.className='pop';document.body.appendChild(cv);
  var cols=['#FFD43B','#FF6B8B','#FFFFFF','#212121','#7B61FF','#FF9F1C'],ps=[];
  var spots=[[W*.25,H*.35],[W*.75,H*.3],[W*.5,H*.5]];
  spots.forEach(function(sp,si){
    for(var i=0;i<34;i++){
      var a=Math.random()*6.283,v=2+Math.random()*5;
      ps.push({x:sp[0],y:sp[1],vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:cols[(i+si)%cols.length],r:2+Math.random()*3,d:si*180});
    }
  });
  var t0=performance.now();
  (function f(t){
    var el=t-t0;g.clearRect(0,0,W,H);
    ps.forEach(function(q){
      if(el<q.d)return;
      q.x+=q.vx;q.y+=q.vy;q.vy+=.09;q.vx*=.985;
      g.globalAlpha=Math.max(0,1-(el-q.d)/1300);g.fillStyle=q.c;
      g.beginPath();g.arc(q.x,q.y,q.r,0,6.283);g.fill();
    });
    if(el<1700)requestAnimationFrame(f);else cv.remove();
  })(t0);
}
document.getElementById('main').addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('.opt'):null;
  if(b)pick(+b.getAttribute('data-k'));
});
function forward(){
  if(phase==='q'){phase='a';}
  else if(phase==='r'){idx=0;phase='q';results=[];for(var z=0;z<20;z++)results.push(null);}
  else if(idx===CARDS.length-1){phase='r';}
  else{idx++;phase='q';}
  render();
}
function back(){
  if(phase==='r'){phase='a';render();return;}
  if(idx>0){idx--;phase='q';render();}
}
document.getElementById('next').addEventListener('click',forward);
document.getElementById('prev').addEventListener('click',back);
var sx=null,sy=null;
document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',function(e){
  if(sx===null)return;
  var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  sx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ if(dx<0)forward(); else back(); }
},{passive:true});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')forward();
  if(e.key==='ArrowLeft')back();
});
render();
</script>
